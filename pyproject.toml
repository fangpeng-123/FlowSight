[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsight"
version = "0.1.0"
description = "把一个 Python 代码库自动变成可交互的 3D 知识图谱"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "方鹏" }]
dependencies = [
    "jedi>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
runtime = [
    "viztracer>=1.0",  # ticket 05; optional until then
]

[project.scripts]
flowsight = "flowsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowsight = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
